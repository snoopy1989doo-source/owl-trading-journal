*{box-sizing:border-box;margin:0;padding:0}
body{

/* 📺 CRT MONITOR SCANLINE EFFECT (OPTIONAL COZY LAYER) */
.crt{

.master-header {

  background: var(--bg-card); border: 1.5px solid var(--border-card);

}

.rpg-hub-value {

.status-btn.active-sl{background:var(--sl-red);border-color:var(--sl-red);color:#FFFFFF;font-weight:bold;box-shadow:0 0 12px rgba(239, 68, 68, 0.35);}
.status-btn.active-be{background:var(--be-yellow);border-color:var(--be-yellow);color:#0B1120;font-weight:bold;box-shadow:0 0 12px rgba(234, 179, 8, 0.35);}

.psych-btn{font-size:8px;color:var(--text-sub);border-color:var(--border-input);}

.glow-green { color: var(--tp-green-light); }
.glow-red { color: var(--sl-red-light); }
.glow-cyan { color: var(--owl-cyan); }

.stat-sublabel { color: var(--text-sub); font-size: 10px; margin-bottom: 4px; font-weight: 500; }
.stat-subvalue { font-size: 13px; font-weight: 700; color: var(--text-main); }

.weekday-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; text-align: center; }
.weekday-node { border: 1px solid var(--border-card); background: var(--bg-card); border-radius: 6px; padding: 6px 2px; min-height: 46px; display: flex; flex-direction: column; justify-content: space-between; }
.weekday-lbl { font-size: 9px; color: var(--owl-gold); font-weight: 600; }
.weekday-val { font-size: 10px; font-weight: 700; }

.cal-day-count { color: var(--owl-cyan); font-size: 8px; text-align: right; }

function today() { return new Date().toISOString().split('T')[0]; }
function fmt(n,d=2) { return Number(n||0).toFixed(d); }
function fmtDate(s) { if (!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${y.slice(2)}`; }
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }

function weekStart(dateStr) { const d=new Date(dateStr); const day=d.getDay(); const diff=day===0?-6:1-day; d.setDate(d.getDate()+diff); return d.toISOString().split('T')[0]; }
function weekEnd(dateStr) { const ws=weekStart(dateStr); const d=new Date(ws); d.setDate(d.getDate()+6); return d.toISOString().split('T')[0]; }
function monthStart(dateStr) { return dateStr.slice(0,7)+'-01'; }
function monthEnd(dateStr) { const [y,m]=dateStr.split('-'); const last=new Date(+y, +m, 0); return `${y}-${m}-${String(last.getDate()).padStart(2,'0')}`; }

function filterByPeriod(trades, period) {
  const safeTrades = Array.isArray(trades) ? trades : [];
  const safePeriod = period || { mode: 'all' };
  if (!safePeriod || safePeriod.mode==='all') return safeTrades;
  const t=today();
  if (safePeriod.mode==='daily') { return safeTrades.filter(tr=>tr && tr.date===(safePeriod.date||t)); }
  if (safePeriod.mode==='weekly') { return safeTrades.filter(tr=>tr && tr.date>=weekStart(t)&&tr.date<=weekEnd(t)); }
  if (safePeriod.mode==='monthly') { return safeTrades.filter(tr=>tr && tr.date>=monthStart(t)&&tr.date<=monthEnd(t)); }
  if (safePeriod.mode==='custom') { return safeTrades.filter(tr=>tr && tr.date>=(safePeriod.from||'')&&tr.date<=(safePeriod.to||'9999-12-31')); }
  return safeTrades;
}

/* ─── 📊 ADVANCED STATS CALCULATION ENGINE ────────────────────────────────── */
function computeStats(trades, startBal) {
  const safeTrades = Array.isArray(trades) ? trades : [];
  const total=safeTrades.length;
  const wins=safeTrades.filter(t=>t && t.status==='TP').length;
  const loses=safeTrades.filter(t=>t && t.status==='SL').length;
  const bes=safeTrades.filter(t=>t && t.status==='BE').length;
  const wr=total>0?(wins/total*100).toFixed(1):0;
  const netPnl=safeTrades.reduce((s,t)=>s+(Number(t.pnl)||0),0);

  function calcRR(t) {
    if (!t) return null;
    const entryExitDist = Math.abs((Number(t.entry)||0) - (Number(t.exit)||0)); 
    const entrySLDist = Math.abs((Number(t.entry)||0) - (Number(t.sl)||0));
    if (entryExitDist === 0 || entrySLDist === 0 || (Number(t.lot)||0) === 0) return null;
    const pipVal = Math.abs(Number(t.pnl)||0) / (entryExitDist * Number(t.lot));
    const riskUSD = entrySLDist * Number(t.lot) * pipVal; 
    const rewardUSD = Math.abs(Number(t.pnl)||0);
    return riskUSD > 0 ? rewardUSD / riskUSD : null;
  }

  const rrs = safeTrades.map(calcRR).filter(r=>r!==null&&r>0);
  const winRRs = safeTrades.filter(t=>t && t.status==='TP').map(calcRR).filter(r=>r!==null&&r>0);
  const loseRRs= safeTrades.filter(t=>t && t.status==='SL').map(calcRR).filter(r=>r!==null&&r>0);
  const avgRR = rrs.length>0 ? (rrs.reduce((a,b)=>a+b,0)/rrs.length).toFixed(2)+'R' : '-';

  const grossProfit = safeTrades.filter(t=>t && Number(t.pnl) > 0).reduce((s,t)=>s+Number(t.pnl), 0);
  const grossLoss = Math.abs(safeTrades.filter(t=>t && Number(t.pnl) < 0).reduce((s,t)=>s+Number(t.pnl), 0));
  const profitFactor = grossLoss > 0 ? (grossProfit / grossLoss).toFixed(2) : (grossProfit > 0 ? '∞' : '0.00');
  const expectancy = total > 0 ? (netPnl / total).toFixed(2) : '0.00';

  const lossTrades = safeTrades.filter(t=>t && Number(t.pnl) < 0);
  const greedCost = Math.abs(lossTrades.filter(t=>t.psychology && t.psychology.greed).reduce((s,t)=>s+Number(t.pnl), 0));
  const fearCost = Math.abs(lossTrades.filter(t=>t.psychology && t.psychology.fear).reduce((s,t)=>s+Number(t.pnl), 0));

  let maxWinStreak = 0, maxLossStreak = 0;
  let currentWinStreak = 0, currentLossStreak = 0;
  
  const streakTrades = safeTrades.filter(t => t && (t.status === 'TP' || t.status === 'SL'));
  for (let t of streakTrades) {
    if (t.status === 'TP') {
      currentWinStreak++; currentLossStreak = 0;
      if (currentWinStreak > maxWinStreak) maxWinStreak = currentWinStreak;
    } else if (t.status === 'SL') {
      currentLossStreak++; currentWinStreak = 0;
      if (currentLossStreak > maxLossStreak) maxLossStreak = currentLossStreak;
    }
  }

  return {total,wins,loses,bes,wr,netPnl,avgRR,profitFactor,expectancy,greedCost,fearCost,maxWinStreak,maxLossStreak};
}

function getAccountAge(account) {
  const allDates = [];
  if (state && Array.isArray(state.trades)) {
    state.trades.forEach(t => { if(t && (account === 'ALL' || (t.account||'Demo') === account)) allDates.push(new Date(t.date)); });
  }
  if (state && Array.isArray(state.cfs)) {
    state.cfs.forEach(c => { if(c && (account === 'ALL' || (c.account||'Demo') === account)) allDates.push(new Date(c.date)); });
  }
  
  if (allDates.length === 0) return "0Y 0M 0D";
  
  const minDate = new Date(Math.min(...allDates));
  const now = new Date();
  
  let years = now.getFullYear() - minDate.getFullYear();
  let months = now.getMonth() - minDate.getMonth();
  let days = now.getDate() - minDate.getDate();
  
  if (days < 0) {
    months--;
    const prevMonthDays = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    days += prevMonthDays;
  }
  if (months < 0) {
    years--;
    months += 12;
  }
  return `${years}Y ${months}M ${days}D`;
}

/* ─── 🧠 2 CONSECUTIVE LOSS COOLDOWN ENGINE (2 HOURS REST LOCK) ─────────── */
function getConsecutiveLossLock(account) {
  const targetAcc = account || (state.f ? state.f.account : 'Demo') || 'Demo';
  const tDate = today();
  const allTrades = Array.isArray(state.trades) ? state.trades : [];
  const todayTrades = allTrades.filter(t => t && t.date === tDate && (targetAcc === 'ALL' || (t.account || 'Demo') === targetAcc));
  const todaySLTrades = todayTrades.filter(t => t && t.status === 'SL');

  const lockKey = `${targetAcc}_${tDate}`;
  let lockUntil = state.lossLocks ? state.lossLocks[lockKey] : undefined;

  // Auto initialize lock timestamp ONLY if undefined (not recorded yet and not explicitly cleared with 0)
  if (todaySLTrades.length >= 2 && (lockUntil === undefined || lockUntil === null)) {
    const latestSL = todaySLTrades[todaySLTrades.length - 1];
    const baseTime = (latestSL && latestSL.createdAt) ? new Date(latestSL.createdAt).getTime() : Date.now();
    lockUntil = baseTime + (2 * 60 * 60 * 1000);
    if (!state.lossLocks) state.lossLocks = {};
    state.lossLocks[lockKey] = lockUntil;
    save(KEY.LOSS_LOCK, state.lossLocks);
  }

  const now = Date.now();
  const numericLockUntil = Number(lockUntil) || 0;
  const remainingMs = numericLockUntil > 0 ? Math.max(0, numericLockUntil - now) : 0;
  const isLocked = todaySLTrades.length >= 2 && remainingMs > 0;
  const remainingSec = Math.ceil(remainingMs / 1000);

  return {
    isLocked,
    remainingMs,
    remainingSec,
    lockUntil: numericLockUntil,
    lockKey,
    todaySLCount: todaySLTrades.length
  };
}

function formatCooldown(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) {
    return `${h}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
  }
  return `${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
}

let cooldownInterval = null;
function startCooldownTicker() {
  if (cooldownInterval) clearInterval(cooldownInterval);
  cooldownInterval = setInterval(() => {
    const timerEl = document.getElementById('cooldown-timer');
    const btnTimerEl = document.getElementById('btn-lock-timer');
    if (!timerEl && !btnTimerEl) return;

    const currentAcc = (state.f && state.f.account) ? state.f.account : 'Demo';
    const lockInfo = getConsecutiveLossLock(currentAcc);
    if (lockInfo.isLocked) {

      if (btnTimerEl) btnTimerEl.textContent = txt;
    } else {
      clearInterval(cooldownInterval);
      cooldownInterval = null;

}

/* ─── 🛡️ DAILY DRAWDOWN & RISK CALCULATION ENGINE ────────────────────────── */
function getDailyRiskStats(account) {
  const targetAcc = account || (state.f ? state.f.account : 'Demo') || 'Demo';
  const allTrades = Array.isArray(state.trades) ? state.trades : [];
  const safeBalances = state.balances || DEFAULT_BALANCES;
  const safeCFs = Array.isArray(state.cfs) ? state.cfs : [];
  
  // 1. Initial Base Balance
  let baseBal = 0;
  if (targetAcc === 'ALL') {
    baseBal = Object.values(safeBalances).reduce((a, b) => a + (Number(b) || 0), 0);
  } else {
    baseBal = Number(safeBalances[targetAcc]) || 0;
  }

  // 2. Filter Account Data
  const accTrades = allTrades.filter(t => t && (targetAcc === 'ALL' || (t.account || 'Demo') === targetAcc));
  const accCFs = safeCFs.filter(c => c && (targetAcc === 'ALL' || (c.account || 'Demo') === targetAcc));

  // 3. Current Net Equity
  const totalNetDeposit = accCFs.reduce((s, cf) => s + (cf.type === 'Deposit' ? Number(cf.amount) || 0 : -Number(cf.amount) || 0), 0);
  const totalTradePnL = accTrades.reduce((s, t) => s + (Number(t.pnl) || 0), 0);
  const currentEquity = baseBal + totalNetDeposit + totalTradePnL;

  // 4. Today's Trades & Deposits
  const tDate = today();
  const todayTrades = accTrades.filter(t => t.date === tDate);
  const todayCFs = accCFs.filter(c => c.date === tDate);

  const todayPnL = todayTrades.reduce((s, t) => s + (Number(t.pnl) || 0), 0);
  const todayNetDeposit = todayCFs.reduce((s, cf) => s + (cf.type === 'Deposit' ? Number(cf.amount) || 0 : -Number(cf.amount) || 0), 0);

  // 5. Start of Day Balance = Current Equity - Today PnL - Today Net Deposits
  const startOfDayBal = Math.max(1, currentEquity - todayPnL - todayNetDeposit);

  // 6. Drawdown Calculations
  const maxDDPct = typeof state.maxDailyDD === 'number' && state.maxDailyDD > 0 ? state.maxDailyDD : 5.0;
  let todayDDUSD = 0;
  let todayDDPct = 0;
  if (todayPnL < 0) {
    todayDDUSD = Math.abs(todayPnL);
    todayDDPct = (todayDDUSD / startOfDayBal) * 100;
  }

  const maxDDUSD = startOfDayBal * (maxDDPct / 100);
  const riskUsagePct = (todayDDPct / maxDDPct) * 100;
  const hp = Math.max(0, Math.min(100, Math.round(100 - riskUsagePct)));
  const remainingRiskUSD = Math.max(0, maxDDUSD - todayDDUSD);

  let level = 'NORMAL';
  if (riskUsagePct >= 100) {
    level = 'STOP'; // Hard stop 100%
  } else if (riskUsagePct >= 70) {
    level = 'CAUTION'; // Warning 70%
  }

  return {
    targetAcc,
    baseBal,
    currentEquity,
    startOfDayBal,
    todayPnL,
    todayDDUSD,
    todayDDPct,
    maxDDPct,
    maxDDUSD,
    riskUsagePct,
    hp,
    remainingRiskUSD,
    level,
    todayTradesCount: todayTrades.length,
    todayLossCount: todayTrades.filter(t => t.status === 'SL').length
  };
}

function initCloudDatabase() {
  if (!isCloudActive) {
    state.syncStatus = 'offline';
    return;
  }

  // 1. Connection state monitoring
  firebase.database().ref('.info/connected').on('value', (snap) => {
    state.syncStatus = snap.val() === true ? 'synced' : 'offline';
    updateSyncBadge();
  });

  // 2. Real-time value listener with Smart Merge (Zero Data Loss)
  firebase.database().ref('retro_trading_journal_data').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      // Smart Merge Trades by Unique ID
      const remoteTrades = Array.isArray(data.trades) ? data.trades : (data.trades ? Object.values(data.trades) : []);
      const localTrades = Array.isArray(state.trades) ? state.trades : [];
      const tradeMap = new Map();
      remoteTrades.forEach(t => { if (t && t.id) tradeMap.set(t.id, t); });
      localTrades.forEach(t => { if (t && t.id && !tradeMap.has(t.id)) tradeMap.set(t.id, t); });
      state.trades = Array.from(tradeMap.values());

      // Smart Merge Cashflows by Unique ID
      const remoteCFs = Array.isArray(data.cfs) ? data.cfs : (data.cfs ? Object.values(data.cfs) : []);
      const localCFs = Array.isArray(state.cfs) ? state.cfs : [];
      const cfMap = new Map();
      remoteCFs.forEach(c => { if (c && c.id) cfMap.set(c.id, c); });
      localCFs.forEach(c => { if (c && c.id && !cfMap.has(c.id)) cfMap.set(c.id, c); });
      state.cfs = Array.from(cfMap.values());

      // Merge Multi-Balances
      if (data.balances) {
        state.balances = { ...DEFAULT_BALANCES, ...state.balances, ...data.balances };
      } else if (data.balance) {
        state.balances = { ...DEFAULT_BALANCES, ...state.balances, Demo: parseFloat(data.balance) || 10000 };
      }

      // Max Daily DD Setting
      if (data.maxDailyDD !== undefined && data.maxDailyDD !== null) {
        state.maxDailyDD = parseFloat(data.maxDailyDD) || 5.0;
        save(KEY.MAX_DAILY_DD, state.maxDailyDD);
      }

      // Merge Loss Locks
      if (data.lossLocks) {
        state.lossLocks = { ...(state.lossLocks || {}), ...data.lossLocks };
        save(KEY.LOSS_LOCK, state.lossLocks);
      }

      save(KEY.TRADES, state.trades);
      save(KEY.CFS, state.cfs);
      save(KEY.BALANCES, state.balances);

      state.syncStatus = 'synced';
      syncCrtView();
      render();
    } else {
      // First boot initialize cloud
      syncToCloud();
    }
  }, (err) => {
    console.error("Firebase Listener Error:", err);
    state.syncStatus = 'offline';
    updateSyncBadge();
  });
}

function syncCrtView() {
  const crtLayer = document.getElementById('crt-layer');
  if(crtLayer) {

    else crtLayer.classList.add('disabled');

}

function buildCalendarSection(allTrades, accountFilter) {
  const safeTrades = Array.isArray(allTrades) ? allTrades : [];
  const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const year = state.calYear || new Date().getFullYear(); 
  const month = state.calMonth !== undefined ? state.calMonth : new Date().getMonth();
  const firstDayIndex = new Date(year, month, 1).getDay();
  const adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1; 
  const totalDays = new Date(year, month + 1, 0).getDate();

  const weekdays = ["MO", "TU", "WE", "TH", "FR", "SA", "SU"];
  let htmlMesh = weekdays.map(w => `<div class="cal-weekday">${w}</div>`).join('');

  for (let i = 0; i < adjustedFirstDay; i++) { htmlMesh += `<div class="cal-day-node skin-cal-blank"></div>`; }

  const tStr = today();
  for (let day = 1; day <= totalDays; day++) {
    const currentStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    let dayTrades = safeTrades.filter(t => t && t.date === currentStr);
    if (accountFilter !== 'ALL') dayTrades = dayTrades.filter(t => t && (t.account || 'Demo') === accountFilter);

    const tradeCount = dayTrades.length;
    const totalPnl = dayTrades.reduce((s, t) => s + (Number(t.pnl)||0), 0);

    let skinClass = "skin-cal-neutral";
    let pnlDisplay = "$0.00";
    if (tradeCount > 0) {
      if (totalPnl > 0) { skinClass = "skin-cal-win"; pnlDisplay = `+$${totalPnl.toFixed(0)}`; }
      else if (totalPnl < 0) { skinClass = "skin-cal-loss"; pnlDisplay = `-$${Math.abs(totalPnl).toFixed(0)}`; }
    }
    
    const isToday = currentStr === tStr;
    if(isToday) skinClass += " skin-cal-today";

    htmlMesh += `
      <div class="cal-day-node ${skinClass}">
        <div class="cal-day-idx">${isToday ? '★' + day : day}</div>
        <div class="cal-day-pnl">${tradeCount > 0 ? pnlDisplay : '$0'}</div>
        <div class="cal-day-count">${tradeCount}T</div>
      </div>`;
  }

  const totalCells = adjustedFirstDay + totalDays;
  const remainingCells = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < remainingCells; i++) { htmlMesh += `<div class="cal-day-node skin-cal-blank"></div>`; }

  return `
    <div class="cal-box">
      <div class="cal-header-layout">
        <button class="btn" id="cal-prev" style="width:35px; margin:0; padding:4px 0;"><</button>
        <span class="glow-cyan" style="font-size:7px;">${monthNames[month]} ${year}</span>
        <button class="btn" id="cal-next" style="width:35px; margin:0; padding:4px 0;">></button>
      </div>
      <div class="cal-grid-mesh">${htmlMesh}</div>
    </div>`;
}

function buildEquityCurve(trades) {
  const safeTrades = Array.isArray(trades) ? trades : [];
  if (safeTrades.length < 2) return `<div class="empty" style="margin-top:12px">เพิ่มประวัติการเทรดเพื่อสร้างสายกราฟพอร์ต</div>`;
  const sorted=[...safeTrades].sort((a,b)=>(a&&b&&a.date&&b.date)?a.date.localeCompare(b.date):0); 
  let cum=0; const points=sorted.map(t=>{ cum+=Number(t.pnl)||0; return cum; }); 
  const maxV=Math.max(...points,0); const minV=Math.min(...points,0); const range=maxV-minV||1; 
  const W=300,H=110,PL=4,PR=4,PT=8,PB=20; const IW=W-PL-PR, IH=H-PT-PB;
  const pts=points.map((v,i)=>{ const x=PL+(i/(points.length-1||1))*IW; const y=PT+IH-((v-minV)/range)*IH; return `${x.toFixed(1)},${y.toFixed(1)}`; }).join(' ');
  const zeroY=(PT+IH-((0-minV)/range)*IH).toFixed(1);
  return `
    <div style="margin-top:12px;color:#FFD54F;font-size:7px;margin-bottom:4px">📈 EQUITY GROWTH TRAJECTORY</div>
    <div style="overflow-x:auto">
      <svg width="${W}" height="${H}" style="display:block;background:#090B15;border:2px solid #304FFE">
        <line x1="${PL}" y1="${zeroY}" x2="${W-PR}" y2="${zeroY}" stroke="#111827" stroke-width="1" stroke-dasharray="4,3"/>
        <polyline points="${pts}" fill="none" stroke="#33D6FF" stroke-width="2"/>
      </svg>
    </div>`;
}

function buildPieChart(st) {
  const total=st.wins+st.loses+st.bes; if (total===0) return `<div class="empty" style="margin-top:12px">ไม่มีข้อมูลเรนเดอร์อัตราส่วนสถิติ</div>`;
  const cx=60,cy=60,r=50;
  const slices=[{label:'Win', val:st.wins, color:'#52FF6B'},{label:'BE', val:st.bes, color:'#FFD54F'},{label:'Lose',val:st.loses,color:'#FF4E63'}].filter(s=>s.val>0);
  let paths=''; let startAngle=-Math.PI/2;
  slices.forEach(s=>{
    const angle=(s.val/total)*Math.PI*2; const endAngle=startAngle+angle;
    const x1=cx+r*Math.cos(startAngle); const y1=cy+r*Math.sin(startAngle);
    const x2=cx+r*Math.cos(endAngle); const y2=cy+r*Math.sin(endAngle);
    const large=angle>Math.PI?1:0;
    if (slices.length===1) { paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${s.color}" opacity="0.85"/>`; }
    else { paths+=`<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large},1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${s.color}" opacity="0.85" stroke="#090B15" stroke-width="1"/>`; }
    startAngle=endAngle;
  });
  const legend=[{label:'Win', pct:st.wins, color:'#52FF6B'},{label:'BE', pct:st.bes, color:'#FFD54F'},{label:'Lose',pct:st.loses, color:'#FF4E63'}];
  return `
    <div style="margin-top:12px;color:#FFD54F;font-size:7px;margin-bottom:4px">🥧 ACTION WIN/BE/LOSE RATIO</div>
    <div class="pie-wrap">
      <svg width="120" height="120" style="flex-shrink:0">${paths}</svg>
      <div class="pie-legend">
        ${legend.map(l=>`
          <div class="pie-legend-item">
            <div class="pie-dot" style="background:${l.color}"></div>
            <span style="color:#F5F5F5">${l.label}</span>
            <span style="color:#33D6FF">${l.pct} <span style="color:#FFD54F">(${total>0?(l.pct/total*100).toFixed(0):0}%)</span></span>
          </div>`).join('')}
      </div>
    </div>`;
}

    // 🧠 Check if 2nd SL occurred today -> activate 2 hours Brain Cooldown Lock
    let triggeredCooldown = false;
    if (f.status === 'SL') {
      const todaySLs = state.trades.filter(t => t && t.date === f.date && (t.account || 'Demo') === currentAcc && t.status === 'SL');
      if (todaySLs.length >= 2) {
        const lockKey = `${currentAcc}_${f.date}`;
        const lockUntil = Date.now() + (2 * 60 * 60 * 1000); // 2 hours
        if (!state.lossLocks) state.lossLocks = {};
        state.lossLocks[lockKey] = lockUntil;
        save(KEY.LOSS_LOCK, state.lossLocks);
        triggeredCooldown = true;
      }
    }

    save(KEY.TRADES, state.trades);
    syncToCloud();

    if (f.status === 'TP') beep('win');
    else if (f.status === 'SL') beep('lose');
    else beep('click');

    if (triggeredCooldown) {
      alert(`🧠 BRAIN COOLDOWN PROTOCOL ACTIVATED!\n\nคุณบันทึกไม้แพ้ (SL) ครบ 2 ไม้ในวันนี้แล้ว\nระบบจะล็อกปุ่มบันทึกไม้ใหม่เป็นเวลา 2 ชั่วโมง เพื่อบังคับให้คุณพักผ่อนสมองและหยุดพักการเทรดครับ!`);
    }

    const currentAccount = state.f.account;
    state.f = { ...state.f, entry: '', exit: '', sl: '', lot: '', pnl: '', status: 'TP', conf: false, fear: false, greed: false, account: currentAccount }; 
    render();
  });

  const btnCF = document.getElementById('btn-add-cf');
  if (btnCF) btnCF.addEventListener('click', () => {
    const cf = state.cf;
    if (!cf.amount || parseFloat(cf.amount) <= 0) {
      alert('ระบุจำนวนเงินสดเป็นตัวเลขด้วย!');
      return;
    }
    if (!Array.isArray(state.cfs)) state.cfs = [];
    state.cfs.push({
      id: uid(),
      date: cf.date,
      type: cf.type,
      amount: parseFloat(cf.amount),
      desc: cf.desc,
      account: cf.account,
      createdAt: new Date().toISOString()
    });
    save(KEY.CFS, state.cfs);
    syncToCloud();
    beep('win');
    const currentAccount = state.cf.account;
    state.cf = { date: today(), type: 'Deposit', amount: '', desc: '', account: currentAccount }; 
    render();
  });

  document.querySelectorAll('[data-del-trade]').forEach(el => {
    el.addEventListener('click', () => {
      if (!confirm('ยืนยันลบประวัติไม้เทรดนี้ถาวร?')) return;
      state.trades = state.trades.filter(t => t && t.id !== el.dataset.delTrade);
      save(KEY.TRADES, state.trades);
      syncToCloud();
      render();
    });
  });

  document.querySelectorAll('[data-del-cf]').forEach(el => {
    el.addEventListener('click', () => {
      if (!confirm('ลบรายการกระแสเงินสดนี้?')) return;
      state.cfs = state.cfs.filter(c => c && c.id !== el.dataset.delCf);
      save(KEY.CFS, state.cfs);
      syncToCloud();
      render();
    });
  });
  
  const tog = document.getElementById('toggle-sound');
  if (tog) tog.addEventListener('click', () => { state.sound = !state.sound; save(KEY.SOUND, state.sound); render(); });
  
  const togCrt = document.getElementById('toggle-crt');
  if (togCrt) togCrt.addEventListener('click', () => { state.crt = !state.crt; save(KEY.CRT, state.crt); render(); });

  /* 🛡️ SAVE RISK SETTING */
  const btnSaveRisk = document.getElementById('btn-save-risk-settings');
  if (btnSaveRisk) {
    btnSaveRisk.addEventListener('click', () => {
      const ddInput = document.getElementById('setting-max-dd');
      const val = parseFloat(ddInput ? ddInput.value : 5.0);
      if (!isNaN(val) && val > 0 && val <= 100) {
        state.maxDailyDD = val;
        save(KEY.MAX_DAILY_DD, state.maxDailyDD);
        syncToCloud();
        beep('win');
        alert(`✅ อัปเดต Max Daily Drawdown เป็น ${val.toFixed(1)}% สำเร็จ!`);
        render();
      } else {
        alert('กรุณากรอกตัวเลข % Drawdown ที่ถูกต้อง (0.5 - 100%)');
      }
    });
  }

  const btnSaveAllBal = document.getElementById('btn-save-all-bal');
  if (btnSaveAllBal) {
    btnSaveAllBal.addEventListener('click', () => {
      document.querySelectorAll('.bal-input-node').forEach(input => {
        const acc = input.dataset.acc;
        const val = parseFloat(input.value);
        if (acc && !isNaN(val) && val >= 0) {
          if (!state.balances) state.balances = { ...DEFAULT_BALANCES };
          state.balances[acc] = val;
        }
      });
      save(KEY.BALANCES, state.balances);
      syncToCloud();
      beep('win');
      alert('✅ อัปเดตทุนเริ่มต้นทุกพอร์ตสำเร็จ!');
      render();
    });
  }

  const btnAddAcc = document.getElementById('btn-add-acc');
  if (btnAddAcc) {
    btnAddAcc.addEventListener('click', () => {
      const nameInput = document.getElementById('new-acc-name');
      const newName = nameInput ? nameInput.value.trim() : '';
      if (!newName) { alert('กรุณาระบุชื่อพอร์ตใหม่'); return; }
      if (!state.balances) state.balances = { ...DEFAULT_BALANCES };
      if (state.balances[newName] !== undefined) { alert('มีพอร์ตชื่อนี้ในระบบแล้ว'); return; }
      
      state.balances[newName] = 0;
      save(KEY.BALANCES, state.balances);
      syncToCloud();
      updateActiveAccount(newName);
      beep('win');
      render();
    });
  }

  document.querySelectorAll('[data-del-acc]').forEach(el => {
    el.addEventListener('click', () => {
      const acc = el.dataset.delAcc;
      if (!acc) return;
      if (confirm(`ยืนยันลบพอร์ต ${acc} จากตัวเลือกตั้งค่า?`)) {
        delete state.balances[acc];
        save(KEY.BALANCES, state.balances);
        syncToCloud();
        if (state.f.account === acc) updateActiveAccount('Demo');
        else render();
      }
    });
  });

  /* 📊 CSV EXPORT FOR FILTERED TRADES */
  const btnExportFiltered = document.getElementById('btn-export-filtered-csv');
  if (btnExportFiltered) {
    btnExportFiltered.addEventListener('click', () => {
      const safeFilter = state.filter || { period: { mode: 'all' }, symbol: 'ALL', status: 'ALL', account: 'ALL' };
      const p = safeFilter.period || { mode: 'all' }; 
      const allTrades = Array.isArray(state.trades) ? state.trades : [];
      let filtered = [...allTrades].sort((a, b) => (b && a && b.date && a.date) ? b.date.localeCompare(a.date) : 0); 
      filtered = filterByPeriod(filtered, p);
      if (safeFilter.symbol !== 'ALL') filtered = filtered.filter(t => t && t.symbol === safeFilter.symbol);
      if (safeFilter.status !== 'ALL') filtered = filtered.filter(t => t && t.status === safeFilter.status);
      if (safeFilter.account !== 'ALL') filtered = filtered.filter(t => t && (t.account || 'Demo') === safeFilter.account);
      
      const accLabel = safeFilter.account || 'ALL';
      const periodLabel = p.mode || 'filtered';
      exportTradesToCSV(filtered, `rtj-trades-${accLabel}-${periodLabel}-${today()}.csv`);
    });
  }

  /* 📊 CSV EXPORT FOR ALL TRADES */
  const btnExportAll = document.getElementById('btn-export-all-csv');
  if (btnExportAll) {
    btnExportAll.addEventListener('click', () => {
      exportTradesToCSV(state.trades || [], `rtj-trades-full-database-${today()}.csv`);
    });
  }

  /* 🔓 EMERGENCY RESET COOLDOWN LOCK */
  const btnResetLossLock = document.getElementById('btn-reset-loss-lock');
  if (btnResetLossLock) {
    btnResetLossLock.addEventListener('click', () => {
      if (!confirm('ยืนยันปลดล็อก Brain Cooldown ทั้งหมดทันที? (ใช้เฉพาะกรณีฉุกเฉินหรือทดสอบระบบ)')) return;
      const tDate = today();
      const accList = getAccountList();
      if (!state.lossLocks) state.lossLocks = {};
      accList.forEach(acc => {
        state.lossLocks[`${acc}_${tDate}`] = 0;
      });
      state.lossLocks[`ALL_${tDate}`] = 0;
      save(KEY.LOSS_LOCK, state.lossLocks);
      syncToCloud();
      beep('win');
      alert('✅ ปลดล็อก Brain Cooldown เรียบร้อยแล้ว!');
      render();
    });
  }

  const btnClear = document.getElementById('btn-clear-trades');
  if (btnClear) btnClear.addEventListener('click', () => {
    if (!confirm('⚠️ คำเตือนขั้นเด็ดขาด: ต้องการลบประวัติการเทรดทั้งหมดออกจากระบบจริงหรือไม่?')) return;
    state.trades = [];
    save(KEY.TRADES, []);
    syncToCloud();
    render();
  });

  const btnBackup = document.getElementById('btn-backup');
  if (btnBackup) btnBackup.addEventListener('click', () => {
    const data = {
      version: 9,
      exportedAt: new Date().toISOString(),
      balances: state.balances,
      trades: state.trades,
      cfs: state.cfs,
      maxDailyDD: state.maxDailyDD,
      lossLocks: state.lossLocks
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `rtj-arcade-v3.9-backup-${today()}.json`; a.click(); URL.revokeObjectURL(url); beep('win');
  });

  const btnImportTrigger = document.getElementById('btn-import-trigger');
  if (btnImportTrigger) btnImportTrigger.addEventListener('click', () => { document.getElementById('btn-import')?.click(); });

  const importInput = document.getElementById('btn-import');
  if (importInput) importInput.addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result); let importedTrades = []; let importedCfs = [];
        if (Array.isArray(data)) { importedTrades = data; }
        else if (data && Array.isArray(data.trades)) {
          importedTrades = data.trades; importedCfs = data.cfs || [];
          if (data.balances) {
            state.balances = { ...DEFAULT_BALANCES, ...data.balances };
          } else if (data.balance) {
            state.balances = { ...DEFAULT_BALANCES, Demo: parseFloat(data.balance) || 10000 };
          }
          if (data.maxDailyDD !== undefined) {
            state.maxDailyDD = parseFloat(data.maxDailyDD) || 5.0;
            save(KEY.MAX_DAILY_DD, state.maxDailyDD);
          }
          if (data.lossLocks) {
            state.lossLocks = { ...data.lossLocks };
            save(KEY.LOSS_LOCK, state.lossLocks);
          }
          save(KEY.BALANCES, state.balances);
        } else { alert('โครงสร้างข้อมูลดิสก์ไม่ถูกต้อง!'); return; }
        if (!confirm(`พบฐานข้อมูลเทรด ${importedTrades.length} ไม้\nยืนยันนำเข้าเพื่อเขียนทับระบบปัจจุบันและซิงก์คลาวด์?`)) return;
        state.trades = importedTrades; save(KEY.TRADES, state.trades);
        state.cfs = importedCfs; save(KEY.CFS, state.cfs);
        syncToCloud(); beep('win'); render();
        alert('✅ IMPORT & CLOUD SYNC COMPLETELY!');
      } catch (err) { alert('❌ JSON Corrupted! อ่านไฟล์ล้มเหลว'); }
    }; reader.readAsText(file); e.target.value = '';
  });

  const calPrev = document.getElementById('cal-prev');
  if (calPrev) calPrev.onclick = () => {
    state.calMonth--; if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
    beep('click'); render();
  };

  const calNext = document.getElementById('cal-next');
  if (calNext) calNext.onclick = () => {
    state.calMonth++; if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
    beep('click'); render();
  };

  /* 🧠 START LIVE COUNTDOWN TICKER */
  startCooldownTicker();
}

function bindPeriodFilter(prefix, period, onChange) {
  const modeEl = document.getElementById(`${prefix}-period-mode`); if (!modeEl) return;
  const safePeriod = period || { mode: 'all', account: 'ALL' };
  modeEl.addEventListener('change', e => { const newP = { mode: e.target.value, account: safePeriod.account }; if (e.target.value === 'daily') newP.date = today(); onChange(newP); });
  const dateEl = document.getElementById(`${prefix}-period-date`); if (dateEl) dateEl.addEventListener('change', e => { onChange({ ...safePeriod, date: e.target.value }); });
  const fromEl = document.getElementById(`${prefix}-period-from`); if (fromEl) fromEl.addEventListener('change', e => { onChange({ ...safePeriod, from: e.target.value }); });
  const toEl = document.getElementById(`${prefix}-period-to`); if (toEl) toEl.addEventListener('change', e => { onChange({ ...safePeriod, to: e.target.value }); });
}

// 📡 BOOT ENGINE RUNTIME
initCloudDatabase();
render();
</script>
</body>
</html>
