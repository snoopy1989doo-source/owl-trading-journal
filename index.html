function attachEvents() {
  const authToggle = document.getElementById('btn-auth-toggle');
  if (authToggle) authToggle.addEventListener('click', () => {
    state.authMode = state.authMode === 'signup' ? 'signin' : 'signup';
    state.authError = '';
    render();
  });

  const authSubmit = document.getElementById('btn-auth-submit');
  if (authSubmit) authSubmit.addEventListener('click', async () => {
    if (!firebaseAuth) return;
    const email = String(document.getElementById('auth-email')?.value || '').trim();
    const password = String(document.getElementById('auth-password')?.value || '');
    const confirmPassword = String(document.getElementById('auth-confirm')?.value || '');
    if (!email || !password) { state.authError = 'กรอก Email และ Password ให้ครบ'; render(); return; }
    if (password.length < 6) { state.authError = 'Password ต้องมีอย่างน้อย 6 ตัวอักษร'; render(); return; }
    if (state.authMode === 'signup' && password !== confirmPassword) { state.authError = 'Password และการยืนยัน Password ไม่ตรงกัน'; render(); return; }
    state.authError = '';
    authSubmit.disabled = true;
    authSubmit.textContent = 'กำลังเชื่อมต่อ...';
    try {
      if (state.authMode === 'signup') await firebaseAuth.createUserWithEmailAndPassword(email, password);
      else await firebaseAuth.signInWithEmailAndPassword(email, password);
    } catch (err) {
      const map = {
        'auth/email-already-in-use': 'อีเมลนี้มีบัญชีอยู่แล้ว',
        'auth/invalid-email': 'รูปแบบอีเมลไม่ถูกต้อง',
        'auth/user-not-found': 'ไม่พบบัญชีนี้',
        'auth/wrong-password': 'รหัสผ่านไม่ถูกต้อง',
        'auth/invalid-credential': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
        'auth/too-many-requests': 'ลองหลายครั้งเกินไป กรุณารอสักครู่',
        'auth/operation-not-allowed': 'ยังไม่ได้เปิด Email/Password ใน Firebase Console',
        'auth/weak-password': 'Password ควรมีอย่างน้อย 6 ตัวอักษร'
      };
      state.authError = map[err.code] || `เข้าสู่ระบบไม่สำเร็จ (${err.code || 'unknown'})`;
      render();
    }
  });

  const authGoogle = document.getElementById('btn-auth-google');
  if (authGoogle) authGoogle.addEventListener('click', async () => {
    if (!firebaseAuth) return;
    state.authError = '';
    authGoogle.disabled = true;
    authGoogle.textContent = 'กำลังเชื่อมต่อ Google...';
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      await firebaseAuth.signInWithPopup(provider);
    } catch (err) {
      const googleErrors = {
        'auth/unauthorized-domain': 'โดเมนนี้ยังไม่ได้เพิ่มใน Firebase Authorized domains',
        'auth/popup-blocked': 'Firefox บล็อกหน้าต่าง Google Login กรุณาอนุญาตป๊อปอัปสำหรับเว็บไซต์นี้ แล้วลองอีกครั้ง หรือสมัครด้วย Email/Password',
        'auth/popup-closed-by-user': 'ปิดหน้าต่าง Google Login ก่อนเสร็จสิ้น กรุณาลองอีกครั้ง',
        'auth/cancelled-popup-request': 'มีหน้าต่าง Google Login เปิดอยู่แล้ว กรุณาทำรายการในหน้าต่างนั้น',
        'auth/account-exists-with-different-credential': 'อีเมลนี้มีบัญชีด้วยวิธีอื่นอยู่แล้ว กรุณาเข้าสู่ระบบด้วยวิธีเดิมก่อน',
        'auth/operation-not-allowed': 'ยังไม่ได้เปิด Google ใน Firebase Console'
      };
      state.authError = googleErrors[err.code] || `Google Login ไม่สำเร็จ (${err.code || 'unknown'})`;
      render();
    }
  });

  const authForgot = document.getElementById('btn-auth-forgot');
  if (authForgot) authForgot.addEventListener('click', async () => {
    if (!firebaseAuth) return;
    const email = String(document.getElementById('auth-email')?.value || '').trim();
    if (!email) { state.authError = 'กรอก Email ก่อนกดลืมรหัสผ่าน'; render(); return; }
    try {
      await firebaseAuth.sendPasswordResetEmail(email);
      state.authError = 'ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่ Email แล้ว';
      render();
    } catch (err) {
      state.authError = err.code === 'auth/user-not-found' ? 'ไม่พบบัญชีจาก Email นี้' : `ส่งลิงก์ไม่สำเร็จ (${err.code || 'unknown'})`;
      render();
    }
  });

  const authSignout = document.getElementById('btn-auth-signout');
  if (authSignout) authSignout.addEventListener('click', () => {
    if (firebaseAuth) firebaseAuth.signOut();
  });

  document.querySelectorAll('[data-nav]').forEach(el => { el.addEventListener('click', () => { state.page = el.dataset.nav; beep('click'); render(); }); });
  document.querySelectorAll('[data-tab-input]').forEach(el => { el.addEventListener('click', () => { state.inputTab = el.dataset.tabInput; render(); }); });
  document.querySelectorAll('[data-tab-log]').forEach(el => { el.addEventListener('click', () => { state.logTab = el.dataset.tabLog; render(); }); });
  
  const hubSetting = document.getElementById('hub-setting-btn');
  if (hubSetting) { hubSetting.addEventListener('click', () => { state.page = 'SETTINGS'; beep('click'); render(); }); }

  /* 🛠️ QUICK PORTFOLIO SWITCHER */
  const hubAccTrigger = document.getElementById('hub-acc-trigger');
  const hubAccLabel = document.getElementById('hub-acc-label');
  const triggerSwitch = () => {
    const accs = getAccountList();
    const currIndex = accs.indexOf(state.f.account);
    const nextAcc = accs[(currIndex + 1) % accs.length];
    updateActiveAccount(nextAcc);
    beep('click');
  };
  if (hubAccTrigger) hubAccTrigger.addEventListener('click', triggerSwitch);
  if (hubAccLabel) hubAccLabel.addEventListener('click', triggerSwitch);

  const liveF = {
    'f-date': v => state.f.date = v,
    'f-symbol': v => state.f.symbol = v,
    'f-tf': v => state.f.tf = v,
    'f-entry': v => state.f.entry = v,
    'f-sl': v => state.f.sl = v,
    'f-planned-tp': v => state.f.plannedTp = v,
    'f-lot': v => state.f.lot = v
  };
  Object.entries(liveF).forEach(([id, fn]) => { const el = document.getElementById(id); if (el) el.addEventListener('input', e => { fn(e.target.value); updatePlanPreview(); }); });

  const fAcc = document.getElementById('f-account');
  if (fAcc) fAcc.addEventListener('change', e => updateActiveAccount(e.target.value));

  const entryImageInput = document.getElementById('f-entry-image');
  if (entryImageInput) entryImageInput.addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const saveButton = document.getElementById('btn-add-trade');
    if (saveButton) saveButton.disabled = true;
    try {
      state.f.entryImage = await compressTradeImage(file);
      const preview = document.getElementById('f-entry-image-preview');
      if (preview) preview.innerHTML = buildImagePreview(state.f.entryImage, 'data-clear-entry-image');
    } catch (err) { alert(err.message || 'เตรียมรูปไม่สำเร็จ'); e.target.value = ''; }
    finally { if (saveButton) saveButton.disabled = false; }
  });
  document.querySelectorAll('[data-clear-entry-image]').forEach(el => el.addEventListener('click', () => {
    state.f.entryImage = '';
    const input = document.getElementById('f-entry-image'); if (input) input.value = '';
    const preview = document.getElementById('f-entry-image-preview'); if (preview) preview.innerHTML = '';
  }));

  const exitImageInput = document.getElementById('manage-exit-image');
  if (exitImageInput) exitImageInput.addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const tradeId = state.manageTradeId;
    const saveButton = document.querySelector(`[data-record-exit="${tradeId}"]`);
    if (saveButton) saveButton.disabled = true;
    try {
      const image = await compressTradeImage(file);
      if (!state.exitImageDrafts) state.exitImageDrafts = {};
      state.exitImageDrafts[tradeId] = image;
      const preview = document.getElementById('manage-exit-image-preview');
      if (preview) preview.innerHTML = buildImagePreview(image, `data-clear-exit-image="${tradeId}"`);
      document.querySelectorAll('[data-clear-exit-image]').forEach(el => el.addEventListener('click', () => {
        delete state.exitImageDrafts[tradeId];
        const input = document.getElementById('manage-exit-image'); if (input) input.value = '';
        const target = document.getElementById('manage-exit-image-preview'); if (target) target.innerHTML = '';
      }));
    } catch (err) { alert(err.message || 'เตรียมรูปไม่สำเร็จ'); e.target.value = ''; }
    finally { if (saveButton) saveButton.disabled = false; }
  });

  document.querySelectorAll('[data-dir]').forEach(el => { el.addEventListener('click', () => { state.f.dir = el.dataset.dir; render(); }); });
  document.querySelectorAll('[data-psych]').forEach(el => { el.addEventListener('click', () => { const k = el.dataset.psych; state.f[k] = !state.f[k]; el.classList.toggle('checked'); beep('click'); }); });
  document.querySelectorAll('[data-trade-view]').forEach(el => { el.addEventListener('click', () => { state.tradeView = el.dataset.tradeView; state.manageTradeId = null; render(); }); });
  document.querySelectorAll('[data-cftype]').forEach(el => { el.addEventListener('click', () => { state.cf.type = el.dataset.cftype; render(); }); });

  const cfAcc = document.getElementById('cf-account'); if (cfAcc) cfAcc.addEventListener('change', e => updateActiveAccount(e.target.value));
  ['cf-date', 'cf-amount', 'cf-desc'].forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener('input', e => { if (id === 'cf-date') state.cf.date = e.target.value; if (id === 'cf-amount') state.cf.amount = e.target.value; if (id === 'cf-desc') state.cf.desc = e.target.value; }); });

  const fltAcc = document.getElementById('flt-account'); if (fltAcc) fltAcc.addEventListener('change', e => updateActiveAccount(e.target.value));
  const fltSym = document.getElementById('flt-symbol'); if (fltSym) fltSym.addEventListener('change', e => { if (!state.filter) state.filter = { account: 'ALL', symbol: 'ALL', status: 'ALL', period: { mode: 'all' } }; state.filter.symbol = e.target.value; render(); });
  const fltSt = document.getElementById('flt-status'); if (fltSt) fltSt.addEventListener('change', e => { if (!state.filter) state.filter = { account: 'ALL', symbol: 'ALL', status: 'ALL', period: { mode: 'all' } }; state.filter.status = e.target.value; render(); });
  
  const statsAcc = document.getElementById('stats-account'); if (statsAcc) statsAcc.addEventListener('change', e => updateActiveAccount(e.target.value));

  bindPeriodFilter('log', state.filter ? state.filter.period : { mode: 'all' }, (p) => { state.filter.period = p; render(); });
  bindPeriodFilter('stats', state.statsPeriod || { mode: 'all', account: 'ALL' }, (p) => { state.statsPeriod = p; render(); });

  /* 🛡️ SAVE OPEN TRADE FROM THE MAIN ENTRY FORM */
  const btnTrade = document.getElementById('btn-add-trade');
  if (btnTrade) btnTrade.addEventListener('click', () => {
    const f = state.f;
    const entry=Number(f.entry), stop=Number(f.sl), target=Number(f.plannedTp), lot=Number(f.lot);
    if (!entry || !stop || !target || !lot || lot <= 0) {
      alert('กรอก Entry Price, Initial SL, Take Profit และ Lot ให้ครบถ้วน');
      return;
    }
    const directionValid = f.dir === 'Sell' ? stop > entry && target < entry : stop < entry && target > entry;
    if (!directionValid) {
      alert(f.dir === 'Sell' ? 'ออเดอร์ SELL ต้องมี SL สูงกว่า Entry และ TP ต่ำกว่า Entry' : 'ออเดอร์ BUY ต้องมี SL ต่ำกว่า Entry และ TP สูงกว่า Entry');
      return;
    }

    const lockInfo = getConsecutiveLossLock(f.account || 'Demo');
    if (lockInfo.isLocked) {
      beep('alert');
      alert(`🧠 BRAIN COOLDOWN ACTIVE\n\nยังเปิดไม้ใหม่ไม่ได้ กรุณาพักอีก ${formatCooldown(lockInfo.remainingSec)}`);
      return;
    }
    const dailyRisk = getDailyRiskStats(f.account || 'Demo');
    if (dailyRisk.level === 'STOP') {
      beep('alert');
      const override = confirm(`💀 DAILY DRAWDOWN LIMIT REACHED\n\nพอร์ต ${f.account || 'Demo'} ใช้ขีดจำกัดรายวันแล้ว คุณยังต้องการบันทึกไม้ที่เปิดอยู่หรือไม่?`);
      if (!override) return;
    }

    if (!Array.isArray(state.trades)) state.trades = [];
    const openedAt = new Date().toISOString();
    const newTrade = {
      id: uid(),
      date: f.date,
      symbol: f.symbol,
      dir: f.dir,
      lifecycle: 'OPEN',
      plannedEntry: entry,
      entry: entry,
      actualEntry: entry,
      initialSl: stop,
      currentSl: stop,
      sl: stop,
      plannedTp: target,
      exit: 0,
      exits: [],
      slHistory: [{ price:stop, at:new Date().toISOString(), note:'Initial SL' }],
      lot,
      pnl: 0,
      status: 'OPEN',
      tf: f.tf,
      psychology: { conf: f.conf, fear: f.fear, greed: f.greed },
      account: f.account,
      entryImage: f.entryImage || '',
      currentPrice: entry,
      openedAt,
      createdAt: openedAt
    };
    state.trades.push(newTrade);
    save(KEY.TRADES, state.trades);
    syncToCloud();
    beep('win');
    const currentAccount = state.f.account;
    state.f = { ...state.f, entry: '', plannedTp: '', sl: '', lot: '', conf: false, fear: false, greed: false, entryImage:'', account: currentAccount };
    state.page = 'LOG'; state.tradeView = 'ACTIVE'; state.manageTradeId = newTrade.id;
    render();
  });

  const btnCF = document.getElementById('btn-add-cf');
  if (btnCF) btnCF.addEventListener('click', () => {
    const cf = state.cf;
    if (!cf.amount || parseFloat(cf.amount) <= 0) {
      alert('ระบุจำนวนเงินสดเป็นตัวเลขด้วย!');
      return;
    }
    if (!Array.isArray(state.cfs)) state.cfs = [];
    state.cfs.push({
      id: uid(),
      date: cf.date,
      type: cf.type,
      amount: parseFloat(cf.amount),
      desc: cf.desc,
      account: cf.account,
      createdAt: new Date().toISOString()
    });
    save(KEY.CFS, state.cfs);
    syncToCloud();
    beep('win');
    const currentAccount = state.cf.account;
    state.cf = { date: today(), type: 'Deposit', amount: '', desc: '', account: currentAccount }; 
    render();
  });

  document.querySelectorAll('[data-manage-trade]').forEach(el => {
    el.addEventListener('click', () => {
      state.manageTradeId = state.manageTradeId === el.dataset.manageTrade ? null : el.dataset.manageTrade;
      if (state.manageTradeId) state.editTradeId = null;
      render();
    });
  });

  document.querySelectorAll('[data-edit-trade]').forEach(el => {
    el.addEventListener('click', () => {
      state.editTradeId = state.editTradeId === el.dataset.editTrade ? null : el.dataset.editTrade;
      if (state.editTradeId) state.manageTradeId = null;
      render();
    });
  });

  document.querySelectorAll('[data-cancel-edit-trade]').forEach(el => {
    el.addEventListener('click', () => { state.editTradeId = null; render(); });
  });

  document.querySelectorAll('[data-save-edit-trade]').forEach(el => {
    el.addEventListener('click', () => {
      const t = state.trades.find(x => x && x.id === el.dataset.saveEditTrade);
      if (!t) return;
      const entry = Number(document.getElementById('edit-entry')?.value);
      const initialSl = Number(document.getElementById('edit-initial-sl')?.value);
      const currentSl = Number(document.getElementById('edit-current-sl')?.value);
      const tp = Number(document.getElementById('edit-tp')?.value);
      const lot = Number(document.getElementById('edit-lot')?.value);
      const dir = document.getElementById('edit-dir')?.value || t.dir;
      const valid = entry && initialSl && tp && lot > 0 && (dir === 'Sell' ? initialSl > entry && tp < entry : initialSl < entry && tp > entry);
      if (!valid) { alert('ตรวจสอบ Entry, Initial SL, Take Profit, Lot และทิศทางให้ถูกต้อง'); return; }
      t.date = document.getElementById('edit-date')?.value || t.date;
      t.account = document.getElementById('edit-account')?.value || t.account || 'Demo';
      t.symbol = document.getElementById('edit-symbol')?.value || t.symbol;
      t.dir = dir;
      t.plannedEntry = entry; t.actualEntry = entry; t.entry = entry;
      t.initialSl = initialSl; t.sl = initialSl; t.currentSl = currentSl || initialSl;
      t.plannedTp = tp; t.lot = lot;
      t.currentPrice = Number(document.getElementById('edit-current-price')?.value) || t.currentPrice || entry;
      t.exit = Number(document.getElementById('edit-exit')?.value) || t.exit || 0;
      t.pnl = Number(document.getElementById('edit-pnl')?.value) || 0;
      if (tradeLifecycle(t) === 'CLOSED') {
        t.status = document.getElementById('edit-status')?.value || t.status;
        t.exitReason = document.getElementById('edit-exit-reason')?.value || t.exitReason || 'Manual Close';
      }
      t.updatedAt = new Date().toISOString();
      save(KEY.TRADES, state.trades); syncToCloud(); beep('click'); state.editTradeId = null; render();
    });
  });

  document.querySelectorAll('[data-cancel-trade]').forEach(el => {
    el.addEventListener('click', () => {
      const t = state.trades.find(x => x && x.id === el.dataset.cancelTrade);
      if (!t) return;
      t.lifecycle = 'CANCELLED'; t.status = 'CANCELLED'; t.cancelledAt = new Date().toISOString();
      state.manageTradeId = null; save(KEY.TRADES, state.trades); syncToCloud(); beep('click'); render();
    });
  });

  document.querySelectorAll('[data-restore-trade]').forEach(el => {
    el.addEventListener('click', () => {
      const t = state.trades.find(x => x && x.id === el.dataset.restoreTrade);
      if (!t) return;
      t.lifecycle = 'PLANNED'; t.status = 'PLANNED'; delete t.cancelledAt;
      state.tradeView = 'ACTIVE'; state.manageTradeId = t.id; save(KEY.TRADES, state.trades); syncToCloud(); beep('click'); render();
    });
  });

  document.querySelectorAll('[data-update-plan]').forEach(el => {
    el.addEventListener('click', () => {
      const t = state.trades.find(x => x && x.id === el.dataset.updatePlan);
      if (!t || tradeLifecycle(t) !== 'PLANNED') return;
      const entry=Number(document.getElementById('manage-plan-entry')?.value);
      const stop=Number(document.getElementById('manage-plan-sl')?.value);
      const target=Number(document.getElementById('manage-plan-tp')?.value);
      const lot=Number(document.getElementById('manage-plan-lot')?.value);
      const valid=t.dir==='Sell'?stop>entry&&target<entry:stop<entry&&target>entry;
      if (!entry || !stop || !target || !lot || lot<=0 || !valid) { alert('ตรวจสอบ Entry, Initial SL, Planned TP และ Lot ให้ตรงกับทิศทาง'); return; }
      t.plannedEntry=entry; t.entry=entry; t.initialSl=stop; t.sl=stop; t.currentSl=stop; t.plannedTp=target; t.lot=lot;
      t.slHistory=[{price:stop,at:new Date().toISOString(),note:'Initial SL'}]; t.updatedAt=new Date().toISOString();
      save(KEY.TRADES, state.trades); syncToCloud(); beep('click'); render();
    });
  });

  document.querySelectorAll('[data-confirm-open]').forEach(el => {
    el.addEventListener('click', () => {
      const t = state.trades.find(x => x && x.id === el.dataset.confirmOpen);
      const entry = Number(document.getElementById('manage-actual-entry')?.value);
      if (!t || !entry) { alert('กรอกราคาที่เข้าได้จริง'); return; }
      const lockInfo = getConsecutiveLossLock(t.account || 'Demo');
      if (lockInfo.isLocked) {
        beep('alert'); alert(`🧠 BRAIN COOLDOWN ACTIVE\n\nยังเปิดไม้ใหม่ไม่ได้ กรุณาพักอีก ${formatCooldown(lockInfo.remainingSec)}`); return;
      }
      const dailyRisk = getDailyRiskStats(t.account || 'Demo');
      if (dailyRisk.level === 'STOP') {
        beep('alert');
        const override = confirm(`💀 DAILY DRAWDOWN LIMIT REACHED\n\nพอร์ต ${t.account||'Demo'} ใช้ขีดจำกัดรายวันแล้ว คุณยังต้องการยืนยันเปิดไม้ตามแผนนี้หรือไม่?`);
        if (!override) return;
      }
      const risk = Math.abs(entry - initialStop(t));
      if (!risk) { alert('Actual Entry ต้องไม่เท่ากับ Initial SL'); return; }
      if ((t.dir === 'Buy' && initialStop(t) >= entry) || (t.dir === 'Sell' && initialStop(t) <= entry)) {
        alert(t.dir === 'Buy' ? 'ไม้ BUY ต้องมี Initial SL ต่ำกว่า Actual Entry' : 'ไม้ SELL ต้องมี Initial SL สูงกว่า Actual Entry'); return;
      }
      t.actualEntry = entry; t.entry = entry; t.lifecycle = 'OPEN'; t.status = 'OPEN'; t.openedAt = new Date().toISOString();
      save(KEY.TRADES, state.trades); syncToCloud(); beep('win'); render();
    });
  });

  document.querySelectorAll('[data-update-live]').forEach(el => {
    el.addEventListener('click', () => {
      const t = state.trades.find(x => x && x.id === el.dataset.updateLive);
      if (!t) return;
      const priceInput = document.getElementById('manage-current-price');
      const slInput = document.getElementById('manage-current-sl');
      const currentPrice = Number(priceInput?.value);
      const currentSl = Number(slInput?.value);
      if (!currentPrice || !currentSl) { alert('กรอก Current Price และ Current SL ให้ครบ'); return; }
      if ((t.dir === 'Buy' && currentSl >= currentPrice) || (t.dir === 'Sell' && currentSl <= currentPrice)) {
        alert(t.dir === 'Buy' ? 'Current SL ของ BUY ต้องต่ำกว่า Current Price' : 'Current SL ของ SELL ต้องสูงกว่า Current Price'); return;
      }
      if (Number(t.currentSl || initialStop(t)) !== currentSl) {
        if (!Array.isArray(t.slHistory)) t.slHistory = [{ price:initialStop(t), at:t.createdAt, note:'Initial SL' }];
        t.slHistory.push({ price:currentSl, at:new Date().toISOString(), note:'SL update' });
      }
      t.currentPrice = currentPrice; t.currentSl = currentSl; t.updatedAt = new Date().toISOString();
      save(KEY.TRADES, state.trades); syncToCloud(); beep('click'); render();
    });
  });

  document.querySelectorAll('[data-record-exit]').forEach(el => {
    el.addEventListener('click', () => {
      const t = state.trades.find(x => x && x.id === el.dataset.recordExit);
      if (!t) return;
      const price = Number(document.getElementById('manage-exit-price')?.value);
      const lot = Number(document.getElementById('manage-exit-lot')?.value);
      const pnlRaw = document.getElementById('manage-exit-pnl')?.value;
      const pnl = Number(pnlRaw);
      const reason = document.getElementById('manage-exit-reason')?.value || 'Manual Close';
      const remaining = remainingLot(t);
      if (!price || !lot || lot <= 0 || pnlRaw === '' || !Number.isFinite(pnl)) { alert('กรอก Exit Price, Exit Lot และ Net P&L ให้ครบ'); return; }
      if (lot > remaining + 0.0000001) { alert(`Exit Lot ต้องไม่เกิน ${fmt(remaining,2)} lot ที่เหลือ`); return; }
      if (!Array.isArray(t.exits)) t.exits = [];
      const exitImage = (state.exitImageDrafts||{})[t.id] || '';
      t.exits.push({ price, lot, pnl, reason, at:new Date().toISOString(), image:exitImage });
      t.pnl = t.exits.reduce((sum, e) => sum + (Number(e.pnl) || 0), 0);
      t.currentPrice = price; t.updatedAt = new Date().toISOString();
      if (remainingLot(t) <= 0.0000001) {
        const totalLot = t.exits.reduce((sum,e)=>sum+(Number(e.lot)||0),0) || 1;
        t.exit = t.exits.reduce((sum,e)=>sum+(Number(e.price)||0)*(Number(e.lot)||0),0) / totalLot;
        t.exitReason = reason; t.lifecycle = 'CLOSED'; t.closedAt = new Date().toISOString();
        t.status = Number(t.pnl) > 0 ? 'TP' : Number(t.pnl) < 0 ? 'SL' : 'BE';
        if (t.status === 'SL') {
          const losses = state.trades.filter(x => x && isClosedTrade(x) && x.date === t.date && (x.account||'Demo') === (t.account||'Demo') && Number(x.pnl) < 0);
          if (losses.length >= 2) {
            const lockKey = `${t.account||'Demo'}_${t.date}`;
            if (!state.lossLocks) state.lossLocks = {};
            state.lossLocks[lockKey] = Date.now() + (2 * 60 * 60 * 1000);
            save(KEY.LOSS_LOCK, state.lossLocks);
          }
        }
        state.manageTradeId = null; state.tradeView = 'CLOSED';
      }
      if (state.exitImageDrafts) delete state.exitImageDrafts[t.id];
      save(KEY.TRADES, state.trades); syncToCloud(); beep(Number(t.pnl)>=0?'win':'lose'); render();
    });
  });

  document.querySelectorAll('[data-del-trade]').forEach(el => {
    el.addEventListener('click', () => {
      if (!confirm('ยืนยันลบประวัติไม้เทรดนี้ถาวร?')) return;
      state.trades = state.trades.filter(t => t && t.id !== el.dataset.delTrade);
      save(KEY.TRADES, state.trades);
      syncToCloud();
      render();
    });
  });

  document.querySelectorAll('[data-del-cf]').forEach(el => {
    el.addEventListener('click', () => {
      if (!confirm('ลบรายการกระแสเงินสดนี้?')) return;
      state.cfs = state.cfs.filter(c => c && c.id !== el.dataset.delCf);
      save(KEY.CFS, state.cfs);
      syncToCloud();
      render();
    });
  });
  
  const tog = document.getElementById('toggle-sound');
  if (tog) tog.addEventListener('click', () => { state.sound = !state.sound; save(KEY.SOUND, state.sound); render(); });
  
  const togCrt = document.getElementById('toggle-crt');
  if (togCrt) togCrt.addEventListener('click', () => { state.crt = !state.crt; save(KEY.CRT, state.crt); render(); });

  /* 🛡️ SAVE RISK SETTING */
  const btnSaveRisk = document.getElementById('btn-save-risk-settings');
  if (btnSaveRisk) {
    btnSaveRisk.addEventListener('click', () => {
      const ddInput = document.getElementById('setting-max-dd');
      const val = parseFloat(ddInput ? ddInput.value : 5.0);
      if (!isNaN(val) && val > 0 && val <= 100) {
        state.maxDailyDD = val;
        save(KEY.MAX_DAILY_DD, state.maxDailyDD);
        syncToCloud();
        beep('win');
        alert(`✅ อัปเดต Max Daily Drawdown เป็น ${val.toFixed(1)}% สำเร็จ!`);
        render();
      } else {
        alert('กรุณากรอกตัวเลข % Drawdown ที่ถูกต้อง (0.5 - 100%)');
      }
    });
  }

  const btnSaveAllBal = document.getElementById('btn-save-all-bal');
  if (btnSaveAllBal) {
    btnSaveAllBal.addEventListener('click', () => {
      document.querySelectorAll('.bal-input-node').forEach(input => {
        const acc = input.dataset.acc;
        const val = parseFloat(input.value);
        if (acc && !isNaN(val) && val >= 0) {
          if (!state.balances) state.balances = { ...DEFAULT_BALANCES };
          state.balances[acc] = val;
        }
      });
      save(KEY.BALANCES, state.balances);
      syncToCloud();
      beep('win');
      alert('✅ อัปเดตทุนเริ่มต้นทุกพอร์ตสำเร็จ!');
      render();
    });
  }

  const btnAddAcc = document.getElementById('btn-add-acc');
  if (btnAddAcc) {
    btnAddAcc.addEventListener('click', () => {
      const nameInput = document.getElementById('new-acc-name');
      const newName = nameInput ? nameInput.value.trim() : '';
      if (!newName) { alert('กรุณาระบุชื่อพอร์ตใหม่'); return; }
      if (!state.balances) state.balances = { ...DEFAULT_BALANCES };
      if (state.balances[newName] !== undefined) { alert('มีพอร์ตชื่อนี้ในระบบแล้ว'); return; }
      
      state.balances[newName] = 0;
      save(KEY.BALANCES, state.balances);
      syncToCloud();
      updateActiveAccount(newName);
      beep('win');
      render();
    });
  }

  document.querySelectorAll('[data-del-acc]').forEach(el => {
    el.addEventListener('click', () => {
      const acc = el.dataset.delAcc;
      if (!acc) return;
      if (confirm(`ยืนยันลบพอร์ต ${acc} จากตัวเลือกตั้งค่า?`)) {
        delete state.balances[acc];
        save(KEY.BALANCES, state.balances);
        syncToCloud();
        if (state.f.account === acc) updateActiveAccount('Demo');
        else render();
      }
    });
  });

  /* 📊 CSV EXPORT FOR FILTERED TRADES */
  const btnExportFiltered = document.getElementById('btn-export-filtered-csv');
  if (btnExportFiltered) {
    btnExportFiltered.addEventListener('click', () => {
      const safeFilter = state.filter || { period: { mode: 'all' }, symbol: 'ALL', status: 'ALL', account: 'ALL' };
      const p = safeFilter.period || { mode: 'all' }; 
      const allTrades = (Array.isArray(state.trades) ? state.trades : []).filter(isClosedTrade);
      let filtered = [...allTrades].sort((a, b) => (b && a && b.date && a.date) ? b.date.localeCompare(a.date) : 0); 
      filtered = filterByPeriod(filtered, p);
      if (safeFilter.symbol !== 'ALL') filtered = filtered.filter(t => t && t.symbol === safeFilter.symbol);
      if (safeFilter.status !== 'ALL') filtered = filtered.filter(t => t && t.status === safeFilter.status);
      if (safeFilter.account !== 'ALL') filtered = filtered.filter(t => t && (t.account || 'Demo') === safeFilter.account);
      
      const accLabel = safeFilter.account || 'ALL';
      const periodLabel = p.mode || 'filtered';
      exportTradesToCSV(filtered, `rtj-trades-${accLabel}-${periodLabel}-${today()}.csv`);
    });
  }

  /* 📊 CSV EXPORT FOR ALL TRADES */
  const btnExportAll = document.getElementById('btn-export-all-csv');
  if (btnExportAll) {
    btnExportAll.addEventListener('click', () => {
      exportTradesToCSV(state.trades || [], `rtj-trades-full-database-${today()}.csv`);
    });
  }

  /* 🔓 EMERGENCY RESET COOLDOWN LOCK */
  const btnResetLossLock = document.getElementById('btn-reset-loss-lock');
  if (btnResetLossLock) {
    btnResetLossLock.addEventListener('click', () => {
      if (!confirm('ยืนยันปลดล็อก Brain Cooldown ทั้งหมดทันที? (ใช้เฉพาะกรณีฉุกเฉินหรือทดสอบระบบ)')) return;
      const tDate = today();
      const accList = getAccountList();
      if (!state.lossLocks) state.lossLocks = {};
      accList.forEach(acc => {
        state.lossLocks[`${acc}_${tDate}`] = 0;
      });
      state.lossLocks[`ALL_${tDate}`] = 0;
      save(KEY.LOSS_LOCK, state.lossLocks);
      syncToCloud();
      beep('win');
      alert('✅ ปลดล็อก Brain Cooldown เรียบร้อยแล้ว!');
      render();
    });
  }

  const btnClear = document.getElementById('btn-clear-trades');
  if (btnClear) btnClear.addEventListener('click', () => {
    if (!confirm('⚠️ คำเตือนขั้นเด็ดขาด: ต้องการลบประวัติการเทรดทั้งหมดออกจากระบบจริงหรือไม่?')) return;
    state.trades = [];
    save(KEY.TRADES, []);
    syncToCloud();
    render();
  });

  const btnBackup = document.getElementById('btn-backup');
  if (btnBackup) btnBackup.addEventListener('click', () => {
    const data = {
      version: 10,
      exportedAt: new Date().toISOString(),
      balances: state.balances,
      trades: state.trades,
      cfs: state.cfs,
      maxDailyDD: state.maxDailyDD,
      lossLocks: state.lossLocks
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `owl-trader-v4.0-backup-${today()}.json`; a.click(); URL.revokeObjectURL(url); beep('win');
  });

  const btnImportTrigger = document.getElementById('btn-import-trigger');
  if (btnImportTrigger) btnImportTrigger.addEventListener('click', () => { document.getElementById('btn-import')?.click(); });

  const importInput = document.getElementById('btn-import');
  if (importInput) importInput.addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result); let importedTrades = []; let importedCfs = [];
        if (Array.isArray(data)) { importedTrades = data; }
        else if (data && Array.isArray(data.trades)) {
          importedTrades = data.trades; importedCfs = data.cfs || [];
          if (data.balances) {
            state.balances = { ...DEFAULT_BALANCES, ...data.balances };
          } else if (data.balance) {
            state.balances = { ...DEFAULT_BALANCES, Demo: parseFloat(data.balance) || 10000 };
          }
          if (data.maxDailyDD !== undefined) {
            state.maxDailyDD = parseFloat(data.maxDailyDD) || 5.0;
            save(KEY.MAX_DAILY_DD, state.maxDailyDD);
          }
          if (data.lossLocks) {
            state.lossLocks = { ...data.lossLocks };
            save(KEY.LOSS_LOCK, state.lossLocks);
          }
          save(KEY.BALANCES, state.balances);
        } else { alert('โครงสร้างข้อมูลดิสก์ไม่ถูกต้อง!'); return; }
        if (!confirm(`พบฐานข้อมูลเทรด ${importedTrades.length} ไม้\nยืนยันนำเข้าเพื่อเขียนทับระบบปัจจุบันและซิงก์คลาวด์?`)) return;
        state.trades = importedTrades; save(KEY.TRADES, state.trades);
        state.cfs = importedCfs; save(KEY.CFS, state.cfs);
        syncToCloud(); beep('win'); render();
        alert('✅ IMPORT & CLOUD SYNC COMPLETELY!');
      } catch (err) { alert('❌ JSON Corrupted! อ่านไฟล์ล้มเหลว'); }
    }; reader.readAsText(file); e.target.value = '';
  });

  const calPrev = document.getElementById('cal-prev');
  if (calPrev) calPrev.onclick = () => {
    state.calMonth--; if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
    beep('click'); render();
  };

  const calNext = document.getElementById('cal-next');
  if (calNext) calNext.onclick = () => {
    state.calMonth++; if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
    beep('click'); render();
  };

  /* 🧠 START LIVE COUNTDOWN TICKER */
  startCooldownTicker();
}

function bindPeriodFilter(prefix, period, onChange) {
  const modeEl = document.getElementById(`${prefix}-period-mode`); if (!modeEl) return;
  const safePeriod = period || { mode: 'all', account: 'ALL' };
  modeEl.addEventListener('change', e => { const newP = { mode: e.target.value, account: safePeriod.account }; if (e.target.value === 'daily') newP.date = today(); onChange(newP); });
  const dateEl = document.getElementById(`${prefix}-period-date`); if (dateEl) dateEl.addEventListener('change', e => { onChange({ ...safePeriod, date: e.target.value }); });
  const fromEl = document.getElementById(`${prefix}-period-from`); if (fromEl) fromEl.addEventListener('change', e => { onChange({ ...safePeriod, from: e.target.value }); });
  const toEl = document.getElementById(`${prefix}-period-to`); if (toEl) toEl.addEventListener('change', e => { onChange({ ...safePeriod, to: e.target.value }); });
}

// 📡 BOOT ENGINE RUNTIME
initCloudDatabase();
render();
</script>
</body>
</html>
